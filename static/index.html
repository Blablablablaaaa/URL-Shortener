<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>

</head>
<body>
  <h1>Paste your link to generate short url for it</h1>

  <p>
    <span>Long link: </span>
    <span id="longLinkField"></span>
  </p>

  <button id="getShortLinkBtn">Get short link</button>

  <p>
    <span>Short link: </span>
    <span id="shortLinkField"></span>
  </p>
</body>
</html>
